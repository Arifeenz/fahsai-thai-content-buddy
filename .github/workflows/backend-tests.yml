name: Backend tests

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # Not real secrets — just need to be present and consistent for the
      # test run (no real Google OAuth or signature verification happens).
      JWT_SECRET: ci-test-jwt-secret
      GOOGLE_CLIENT_ID: ci-test-google-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest
